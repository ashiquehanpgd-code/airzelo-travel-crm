# iPhone app: build and test the offline engine against the desktop core, then build and test the app
# on an iPhone simulator. Nothing here signs, uploads or publishes anything.
name: ios

on:
  push:
    branches: [main, "feature/ios-offline-app"]
    paths: ["ios/**", "core/server/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "core/server/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: engine checks (desktop parity, backups, security, scale)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }

      - name: iPhone schema is the desktop schema
        run: python ios/tools/export_schema.py --check

      - name: Desktop parity fixtures (3 seeds x 600 operations)
        run: |
          for s in 7 42 99; do python ios/tools/parity.py --out "$RUNNER_TEMP/parity-$s" --seed $s --ops 600; done

      - name: Build checks
        working-directory: ios/AirZeloKit
        run: swift build -c release

      - name: All checks (seed 7, 20 000-booking scale test)
        working-directory: ios/AirZeloKit
        run: .build/release/AirZeloChecks --parity "$RUNNER_TEMP/parity-7" --scale 20000

      - name: Parity, more seeds
        working-directory: ios/AirZeloKit
        run: |
          for s in 42 99; do .build/release/AirZeloChecks --parity "$RUNNER_TEMP/parity-$s" --only parity; done

      - name: Desktop restores the iPhone export and reproduces every figure
        run: python ios/tools/parity.py --check-export "$RUNNER_TEMP/parity-7"

  simulator:
    name: app build + tests on iPhone simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }

      - name: Desktop parity fixture
        run: python ios/tools/parity.py --out "$RUNNER_TEMP/parity" --seed 7 --ops 400

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/AirZelo/project.yml

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          import re
          def rank(rt, x):  # newest iOS, then the newest standard iPhone model (not SE / Plus / Pro Max)
              v = tuple(int(n) for n in re.findall(r"\d+", rt.split("iOS")[-1]))
              m = re.match(r"iPhone (\d+)( Pro)?$", x["name"])
              return (v, 1 if m else 0, int(m.group(1)) if m else 0)
          best = max(((rank(rt, x), x) for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")), key=lambda p: p[0])
          print(best[1]["udid"])')
          xcrun simctl list devices | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Unit + engine checks + UI smoke test on the simulator
        run: |
          set -o pipefail
          # TEST_RUNNER_* environment variables reach the tests as AZ_* (they must be environment, not build settings)
          export TEST_RUNNER_AZ_PARITY_DIR="$RUNNER_TEMP/parity" TEST_RUNNER_AZ_REQUIRE_PARITY=1
          xcodebuild test -project ios/AirZelo/AirZelo.xcodeproj -scheme AirZelo \
            -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath "$RUNNER_TEMP/AirZelo.xcresult" \
            > "$RUNNER_TEMP/test.log" 2>&1 || true
          grep -E "^(PASS|FAIL|SKIP) |^       |checks passed|Test Case|Executed|error:|\*\* TEST" "$RUNNER_TEMP/test.log" || true
          if ! grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test.log"; then
            echo "---- failure context ----"; grep -B2 -A40 "error: -\[" "$RUNNER_TEMP/test.log" | head -200; exit 1
          fi

      - name: Keep the test log and result bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-tests
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/AirZelo.xcresult
          retention-days: 7

      - name: Release build for iPhone (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project ios/AirZelo/AirZelo.xcodeproj -scheme AirZelo -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO | tail -5
