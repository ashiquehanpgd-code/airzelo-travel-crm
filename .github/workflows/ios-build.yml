# Builds installable iPhone artifacts from the iOS app. Run it by hand (Actions > ios-build > Run workflow).
#
# Always produced (and verified):
#   AirZelo-<version>-ios-arm64-UNSIGNED.ipa   Release build for a real iPhone. NOT installable as is: iOS only runs
#                                              apps signed for the device. Sign it (see ios/README.md) or add secrets.
#   AirZelo-<version>-ios-SIMULATOR.app.zip    For the iOS Simulator on a Mac only; does not run on an iPhone.
#
# Produced only when the owner's signing secrets exist (nothing is signed with anyone else's identity):
#   AirZelo-<version>-ios-arm64-signed.ipa     installs on the devices in the provisioning profile
#   secrets: IOS_TEAM_ID, IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64
#   the method follows the profile: Ad Hoc profile -> release-testing, Development profile -> debugging
name: ios-build

on:
  # manual runs need this file on the default branch; until then it also runs on pushes to the feature branch
  push:
    branches: ["feature/ios-offline-app"]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
    inputs:
      export_method:
        description: "Signed export method: taken from the provisioning profile (ad hoc or development)"
        type: choice
        options: [auto]
        default: auto

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/AirZelo/project.yml
          xcodebuild -version

      - name: Release build for iPhone (arm64, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project ios/AirZelo/AirZelo.xcodeproj -scheme AirZelo -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -3

      - name: Simulator build
        run: |
          set -o pipefail
          xcodebuild build -project ios/AirZelo/AirZelo.xcodeproj -scheme AirZelo -configuration Release \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd-sim" | tail -3

      - name: Package and verify
        id: pkg
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd-device/Build/Products/Release-iphoneos/AirZelo.app"
          sim="$RUNNER_TEMP/dd-sim/Build/Products/Release-iphonesimulator/AirZelo.app"
          ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist")
          out="$RUNNER_TEMP/out"; mkdir -p "$out/Payload"
          cp -R "$app" "$out/Payload/"
          (cd "$out" && zip -qry "AirZelo-$ver-ios-arm64-UNSIGNED.ipa" Payload && rm -rf Payload)
          (cd "$(dirname "$sim")" && zip -qry "$out/AirZelo-$ver-ios-SIMULATOR.app.zip" AirZelo.app)
          echo "== device app"
          plutil -p "$app/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion|DTPlatformName|UIDeviceFamily" -A0
          file "$app/AirZelo"
          test "$(lipo -archs "$app/AirZelo")" = "arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")" = "iphoneos"
          if codesign -dv "$app" 2>/dev/null; then echo "signature: present"; else echo "signature: NONE (unsigned, as expected)"; fi
          echo "== simulator app"
          file "$sim/AirZelo"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$sim/Info.plist")" = "iphonesimulator"
          echo "== artifacts"
          (cd "$out" && unzip -l "AirZelo-$ver-ios-arm64-UNSIGNED.ipa" | head -5 && ls -l && shasum -a 256 *.ipa *.zip | tee SHA256SUMS.txt)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Signed IPA (only with the owner's signing secrets)
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # 1. certificate + private key into a throwaway keychain (deleted at the end of the step)
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw=$(uuidgen)
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$IOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ident=$(security find-identity -p codesigning "$kc" | awk -F'"' '/Apple (Distribution|Development)/{print $2; exit}')
          test -n "$ident" || { echo "No Apple Distribution / Development identity in the .p12"; security find-identity -v -p codesigning "$kc"; exit 1; }
          echo "signing identity: $ident"
          # 2. the profile decides bundle ID and export method (ad hoc / development)
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          pp() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          uuid=$(pp UUID); pname=$(pp Name); appid=$(pp Entitlements:application-identifier); bundle="${appid#*.}"
          devices=$(pp ProvisionedDevices 2>/dev/null | grep -c -E "^ +[0-9A-Fa-f-]{20,}" || true)
          if [ "$(pp Entitlements:get-task-allow)" = "true" ]; then method=debugging
          elif [ "$devices" -gt 0 ]; then method=release-testing
          else echo "This profile has no devices (App Store profile): use an Ad Hoc or Development profile"; exit 1; fi
          echo "profile '$pname': bundle $bundle, $devices device(s), method $method, expires $(pp ExpirationDate)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          # 3. archive signed with that identity + profile, then export the .ipa
          xcodebuild archive -project ios/AirZelo/AirZelo.xcodeproj -scheme AirZelo -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/AirZelo.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$bundle" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$ident" PROVISIONING_PROFILE_SPECIFIER="$uuid" OTHER_CODE_SIGN_FLAGS="--keychain $kc" | tail -3
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$method</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$ident</string>
            <key>provisioningProfiles</key><dict><key>$bundle</key><string>$uuid</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AirZelo.xcarchive" -exportPath "$RUNNER_TEMP/signed" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tail -3
          # 4. verify the signed app before publishing it as an artifact
          ver="${{ steps.pkg.outputs.version }}"
          out="$RUNNER_TEMP/out/AirZelo-$ver-ios-arm64-signed-$method.ipa"
          mv "$RUNNER_TEMP/signed/AirZelo.ipa" "$out"
          chk="$RUNNER_TEMP/chk"; rm -rf "$chk"; unzip -q "$out" -d "$chk"
          codesign --verify --deep --strict --verbose=2 "$chk/Payload/AirZelo.app"
          codesign -dv "$chk/Payload/AirZelo.app" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" | head -4
          test -f "$chk/Payload/AirZelo.app/embedded.mobileprovision" && echo "embedded profile: present"
          rm -rf "$chk"
          (cd "$RUNNER_TEMP/out" && shasum -a 256 *.ipa *.zip > SHA256SUMS.txt && ls -l)
          security delete-keychain "$kc"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AirZelo-${{ steps.pkg.outputs.version }}-ios-builds
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30
