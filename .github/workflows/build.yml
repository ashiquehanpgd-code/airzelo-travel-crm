# Build and test Travel Agency CRM on real macOS (Apple Silicon + Intel) and Windows runners.
# Every job runs the core test suite on the SAME bundled Python runtime that ships in the installer,
# packages the app, then smoke-tests the packaged app with its own runtime.
# Installers are unsigned until signing secrets are added (see docs/RELEASE.md).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-14, runtime: mac-arm64, dist: "--mac --arm64", app: "dist/mac-arm64/Travel Agency CRM.app", exe: "dist/mac-arm64/Travel Agency CRM.app/Contents/MacOS/Travel Agency CRM", python: "build/runtime/mac-arm64/python/bin/python3" }
          - { name: mac-x64, os: macos-13, runtime: mac-x64, dist: "--mac --x64", app: "dist/mac/Travel Agency CRM.app", exe: "dist/mac/Travel Agency CRM.app/Contents/MacOS/Travel Agency CRM", python: "build/runtime/mac-x64/python/bin/python3" }
          - { name: win-x64, os: windows-latest, runtime: win-x64, dist: "--win --x64", app: "dist/win-unpacked", exe: "dist/win-unpacked/Travel Agency CRM.exe", python: "build/runtime/win-x64/python/python.exe" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: desktop/package-lock.json }

      - name: Fetch pinned Python runtime (sha256-verified)
        run: python build/fetch_python.py ${{ matrix.runtime }}

      - name: Build macOS ticket reader (universal)
        if: runner.os == 'macOS'
        run: |
          mkdir -p core/bin core/build-tmp
          swiftc -O -target arm64-apple-macos12 core/tools/ticket_reader.swift -o core/build-tmp/reader-arm64
          swiftc -O -target x86_64-apple-macos13 core/tools/ticket_reader.swift -o core/build-tmp/reader-x64
          lipo -create core/build-tmp/reader-arm64 core/build-tmp/reader-x64 -output core/bin/ta-ticket-reader
          rm -rf core/build-tmp

      - name: Core tests on the bundled runtime
        working-directory: core/tests
        env: { TACRM_NO_OPEN: "1" }
        shell: bash
        run: |
          export TACRM_TICKET_DIR="$RUNNER_TEMP/tickets"
          "../../${{ matrix.python }}" -B -W ignore -m unittest discover -v

      - name: WhatsApp template tests
        working-directory: core/tests
        run: node whatsapp.test.js

      - name: Package
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder ${{ matrix.dist }} --publish never

      - name: Smoke-test the packaged app with its own runtime
        shell: bash
        run: python build/smoke_test.py --app "${{ matrix.app }}"

      - name: GUI end-to-end test of the packaged app (create agency, open, sign in, clean quit)
        shell: bash
        run: node build/e2e_gui.mjs "${{ matrix.exe }}"

      - uses: actions/upload-artifact@v4
        with:
          name: travel-agency-crm-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
