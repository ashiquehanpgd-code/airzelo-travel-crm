# Build and test AirZelo on real macOS (Apple Silicon + Intel) and Windows runners.
# Every job runs the core test suite on the SAME bundled Python runtime that ships in the installer,
# packages the app, then smoke-tests the packaged app with its own runtime.
# Installers are unsigned until signing secrets are added (see docs/RELEASE.md).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-14, runtime: mac-arm64, dist: "--mac --arm64", app: "dist/mac-arm64/AirZelo.app", exe: "dist/mac-arm64/AirZelo.app/Contents/MacOS/AirZelo", python: "build/runtime/mac-arm64/python/bin/python3" }
          - { name: mac-x64, os: macos-15-intel, runtime: mac-x64, dist: "--mac --x64", app: "dist/mac/AirZelo.app", exe: "dist/mac/AirZelo.app/Contents/MacOS/AirZelo", python: "build/runtime/mac-x64/python/bin/python3" }
          - { name: win-x64, os: windows-latest, runtime: win-x64, dist: "--win --x64", app: "dist/win-unpacked", exe: "dist/win-unpacked/AirZelo.exe", python: "build/runtime/win-x64/python/python.exe" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: desktop/package-lock.json }

      - name: Release identity (app ID, NSIS GUID, product name must not change)
        run: python build/check_release_config.py

      - name: Fetch pinned Python runtime (sha256-verified, trimmed)
        run: python build/fetch_python.py ${{ matrix.runtime }}

      - name: Runtime check (core imports, compiled modules, pip/IDLE/tkinter removed)
        run: python build/check_runtime.py build/runtime/${{ matrix.runtime }}/python

      - name: Build macOS ticket reader (universal)
        if: runner.os == 'macOS'
        run: |
          mkdir -p core/bin core/build-tmp
          swiftc -O -target arm64-apple-macos12 core/tools/ticket_reader.swift -o core/build-tmp/reader-arm64
          swiftc -O -target x86_64-apple-macos13 core/tools/ticket_reader.swift -o core/build-tmp/reader-x64
          lipo -create core/build-tmp/reader-arm64 core/build-tmp/reader-x64 -output core/bin/ta-ticket-reader
          rm -rf core/build-tmp

      - name: Ticket reader output for the synthetic fixture (PDFKit text order differs between macOS versions)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          core/bin/ta-ticket-reader core/tests/fixture_ticket.pdf

      # Windows 10/11 with an English display language already has this; the Server image may not.
      - name: Windows text recognition (English OCR, part of Windows) and the ticket reader on the synthetic fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = 'Language.OCR~~~en-US~0.0.1.0'
          $cap = Get-WindowsCapability -Online -Name $name
          "OCR capability $name : $($cap.State)"
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name $name | Out-Null; "installed $name" }
          $out = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File core/tools/ticket_ocr_windows.ps1 -Path core/tests/fixture_ticket.png
          $json = $out | Select-Object -Last 1
          $json.Substring(0, [Math]::Min(400, $json.Length))
          if (-not ($json | ConvertFrom-Json).ok) { throw 'Windows OCR helper failed' }

      - name: Core tests on the bundled runtime
        working-directory: core/tests
        env: { TACRM_NO_OPEN: "1" }
        shell: bash
        run: |
          export TACRM_TICKET_DIR="$RUNNER_TEMP/tickets"
          "../../${{ matrix.python }}" -B -W ignore -m unittest discover -v

      - name: WhatsApp template tests
        working-directory: core/tests
        run: node whatsapp.test.js

      - name: Package
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder ${{ matrix.dist }} --publish never

      - name: Runtime check inside the packaged app
        shell: bash
        run: python build/check_runtime.py --app "${{ matrix.app }}"

      - name: Smoke-test the packaged app with its own runtime
        shell: bash
        run: python build/smoke_test.py --app "${{ matrix.app }}"

      - name: GUI end-to-end test of the packaged app (create agency, open, sign in, clean quit)
        shell: bash
        run: node build/e2e_gui.mjs "${{ matrix.exe }}"

      # The steps above test the unpacked build. These test the files users actually download.
      - name: Install from the DMG and the ZIP, check version and architecture, test the installed app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          arch=${{ matrix.name == 'mac-arm64' && 'arm64' || 'x86_64' }}
          tag=${{ matrix.name == 'mac-arm64' && 'arm64' || 'x64' }}
          dmg="dist/AirZelo-$version-mac-$tag.dmg"; zip="dist/AirZelo-$version-mac-$tag.zip"
          ls -l "$dmg" "$zip"
          check() {
            plist="$1/Contents/Info.plist"
            got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
            [ "$got" = "$version" ] || { echo "version $got, expected $version"; exit 1; }
            archs=$(lipo -archs "$1/Contents/MacOS/AirZelo")
            [ "$archs" = "$arch" ] || { echo "architecture $archs, expected $arch"; exit 1; }
            echo "$1: version $got, architecture $archs"
            python build/smoke_test.py --app "$1"
            node build/e2e_gui.mjs "$1/Contents/MacOS/AirZelo"
          }
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          [ -L "$mnt/Applications" ] || { echo "DMG has no Applications link"; exit 1; }
          mkdir -p "$RUNNER_TEMP/from-dmg"
          ditto "$mnt/AirZelo.app" "$RUNNER_TEMP/from-dmg/AirZelo.app"
          hdiutil detach "$mnt"
          check "$RUNNER_TEMP/from-dmg/AirZelo.app"
          ditto -x -k "$zip" "$RUNNER_TEMP/from-zip"
          check "$RUNNER_TEMP/from-zip/AirZelo.app"

      - name: Install with the setup.exe (silent, per user), test the installed app, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          $setup = "dist\AirZelo-$version-win-x64-setup.exe"
          Get-Item $setup | Format-List Name, Length
          $dir = Join-Path $env:RUNNER_TEMP 'AirZelo-install'
          $p = Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $dir 'AirZelo.exe'
          if (-not (Test-Path $exe)) { throw "AirZelo.exe not installed in $dir" }
          $got = (Get-Item $exe).VersionInfo.ProductVersion
          if ($got -ne $version -and $got -ne "$version.0") { throw "installed version $got, expected $version" }
          $entry = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -like 'AirZelo*'
          if (-not $entry) { throw 'no Add/Remove Programs entry' }
          "installed: $exe, version $got, registered as '$($entry.DisplayName)' $($entry.DisplayVersion)"
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AirZelo.lnk'
          if (-not (Test-Path $lnk)) { throw 'no desktop shortcut' }
          python build/smoke_test.py --app $dir
          if ($LASTEXITCODE -ne 0) { throw 'smoke test of the installed app failed' }
          node build/e2e_gui.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'GUI test of the installed app failed' }
          $u = Start-Process (Join-Path $dir 'Uninstall AirZelo.exe') -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller exit code $($u.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'uninstall left AirZelo.exe behind' }
          'uninstalled cleanly'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: travel-agency-crm-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14
